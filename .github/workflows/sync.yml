name: Sync to secondary repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to repo 2
        env:
          TOKEN: ${{ secrets.COMPTE2_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git remote remove backup || true
          git remote add backup https://x-access-token:${TOKEN}@github.com/zarroukiammar-coder/deploy-app-spring-angular.git

          git push backup HEAD:main
